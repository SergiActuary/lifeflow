project:
  type: website
  output-dir: _site
  execute-dir: project

website:
  title: "lifeflow"
  description: "Fast, vectorized Python library for life-insurance cash-flow projection and BEL."
  site-url: "https://sergiactuary.github.io/lifeflow/"
  repo-url: "https://github.com/SergiActuary/lifeflow"
  open-graph: true
  twitter-card: true
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: example.qmd
        text: Guide
      - href: reference.qmd
        text: Reference
      - href: changelog.qmd
        text: Changelog
    right:
      - icon: github
        href: https://github.com/SergiActuary/lifeflow
        aria-label: GitHub
      - text: PyPI
        href: https://pypi.org/project/lifeflow/
  page-footer:
    center: "lifeflow · MIT License · Sergi López Vergara"

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    code-copy: true

jupyter: python3
