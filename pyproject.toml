[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "lifeflow._probabilities_rs"
features = ["pyo3/extension-module"]

[project]
name = "lifeflow"
version = "0.1.1"
description = "Vectorized life actuarial cash-flow and BEL engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SergiActuary" },
]
keywords = ["actuarial", "actuary", "life-insurance", "cashflow", "BEL", "mortality-tables", "actuarial-modeling", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "polars",
    "numpy",
    "numba",
]

[project.urls]
Homepage = "https://github.com/SergiActuary/lifeflow"
Repository = "https://github.com/SergiActuary/lifeflow"
Documentation = "https://sergiactuary.github.io/lifeflow/"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "fastexcel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
