project:
  type: website
  output-dir: _site
  execute-dir: project

website:
  title: "LifeFlow"
  description: "Fast, vectorized Python library for life-insurance cash-flow projection and BEL."
  site-url: "https://sergiactuary.github.io/lifeflow/"
  repo-url: "https://github.com/SergiActuary/lifeflow"
  open-graph: true
  twitter-card: true
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: tutorial.qmd
        text: Tutorial
      - href: example.qmd
        text: Guide
      - href: reference.qmd
        text: Reference
      - href: changelog.qmd
        text: Changelog
    right:
      - text: GitHub
        href: https://github.com/SergiActuary/lifeflow
      - text: PyPI
        href: https://pypi.org/project/lifeflow/
  page-footer:
    left: "lifeflow · MIT License"
    right: "Built by [Sergi López Vergara](https://sergiactuary.github.io/)"

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    code-copy: true
    grid:
      body-width: 1200px

jupyter: python3
