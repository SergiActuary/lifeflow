[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifeflow"
version = "0.0.3"
description = "Vectorized life actuarial cash-flow and BEL engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SergiActuary" },
]
keywords = ["actuarial", "life-insurance", "cashflow", "BEL", "numpy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "polars",
    "numpy",
    "numba",
    "joblib",
]

[project.urls]
Homepage = "https://github.com/SergiActuary/lifeflow"
Repository = "https://github.com/SergiActuary/lifeflow"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "fastexcel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
